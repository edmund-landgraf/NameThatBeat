<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NameThatBeat MVP</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="game-card" aria-label="NameThatBeat MVP">
        <p class="eyebrow">namethatbeat.com</p>
        <h1>Name That Beat</h1>
        <p class="lede">MVP checkpoint: one track, one 10-second chunk, eight choices.</p>

        <button class="primary-action" id="start-game" type="button">Start Game</button>

        <section class="play-panel" aria-live="polite">
          <div>
            <p class="eyebrow">Track Chunk</p>
            <h2 id="track-status">Press Start Game</h2>
            <p id="chunk-status">The round will load Vivaldi - The Four Seasons - Summer.</p>
          </div>
        </section>

        <section class="choice-panel" aria-label="Answer choices">
          <div class="answer-grid" id="answer-grid"></div>
        </section>

        <section class="result-panel" aria-live="polite">
          <div>
            <span id="points-earned">0</span>
            <small>Points earned</small>
          </div>
          <p id="result-message">No answer yet.</p>
        </section>
      </section>
    </main>

    <script src="src/solo.js"></script>
  </body>
</html>
